name: Notificar novedades por correo

on:
  push:
    branches: [main]
    paths:
      - "content/site.json"

# Necesario para que la acción pueda guardar de vuelta content/.notified.json
permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enviar correos de novedades
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/notify-subscribers.js

      - name: Guardar registro de lo ya enviado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: registrar novedades ya notificadas"
          file_pattern: content/.notified.json
